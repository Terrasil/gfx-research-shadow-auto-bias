<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Map Bias Lab</title>
<style>
:root{color-scheme:dark;--bg:#101618;--surface:#182023;--line:#334145;--text:#e6edeb;--muted:#aebdbd;--accent:#9ce1ce;--miss:#86d3ee;--false:#ff936e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:20px clamp(16px,4vw,54px)}
h1,h2,p{margin:0}h1{font-size:clamp(22px,2.7vw,34px);font-weight:670;letter-spacing:-.045em}
h2{font-size:15px;font-weight:650}
#hardware{color:var(--muted);font-size:12px;text-align:right;max-width:45ch}
main{display:grid;grid-template-columns:246px minmax(0,1fr);gap:20px;max-width:1560px;margin:auto;padding:24px clamp(16px,4vw,54px)}
aside{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:12px;align-self:start}
fieldset{margin:0;padding:0;border:0;min-width:0}fieldset:disabled{opacity:.68}
.controls{display:grid;gap:13px}
label{display:block;color:var(--muted);font-size:12px;font-weight:580}
select,input,button{width:100%;font:inherit;color:var(--text);background:#101719;border:1px solid #45575b;border-radius:7px;padding:8px 9px}
select,input{margin-top:4px}
button{cursor:pointer;font-weight:600}button:hover:not(:disabled){border-color:var(--accent);background:#1d2929}
button:disabled{opacity:.5;cursor:default}
button.primary{background:#a6dfd0;color:#122725;border-color:#a6dfd0}
button.primary:hover:not(:disabled){background:#c2efe3;color:#0d2321}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:13px;margin-top:15px}
#status{min-height:36px;color:var(--muted);font-size:12px;margin-top:10px;overflow-wrap:anywhere}
#status[data-error="true"]{color:var(--false)}
#comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;overflow:hidden}
.card h2{padding:11px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block;width:100%;aspect-ratio:4/3;background:#0d1214;image-rendering:auto}
table{border-collapse:collapse;width:100%;margin-top:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted)}
.legend{margin-top:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--false)}
.dot.miss{background:var(--miss)}
.meta{margin-bottom:12px;color:var(--muted);font-size:13px}
#engine{display:none}
@media(max-width:960px){main{grid-template-columns:200px minmax(0,1fr);gap:12px;padding-inline:14px}header{padding-inline:14px}}
@media(max-width:760px){main{display:flex;flex-direction:column}aside{width:100%}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:490px){#comparison{grid-template-columns:1fr}#hardware{display:none}}
</style>
</head>
<body>
<header><h1>Shadow Map Bias Lab</h1><p id="hardware"></p></header>
<main>
<aside aria-label="Experiment controls">
<fieldset id="controls" disabled>
<div class="controls">
<label>Heightmap and view<select id="scene"></select></label>
<label>Shadow sampling<select id="filter"><option value="0">Hard · one tap</option><option value="1">PCF · 3 × 3</option></select></label>
<label>Left method<select id="methodA"></select></label>
<label id="labelA">Bias parameter<input id="valueA" type="number" min="0" step="any"></label>
<label>Right method<select id="methodB"></select></label>
<label id="labelB">Bias parameter<input id="valueB" type="number" min="0" step="any"></label>
<label>Display<select id="display"><option value="0">Shaded terrain</option><option value="1">Classification errors</option><option value="2">Binary / filtered mask</option><option value="3">Center bias · logarithmic</option></select></label>
</div>
<div class="actions">
<button id="capture" class="primary">Save comparison PNG</button>
<button id="quality">Export quality CSV</button>
<button id="timing">Run GPU timing</button>
<button id="stop" hidden>Stop timing</button>
</div>
</fieldset>
<p id="status" role="status">Preparing heightmaps…</p>
</aside>
<section aria-label="Comparison results">
<p class="meta" id="metadata"></p>
<div id="comparison">
<div class="card"><h2 id="captionA">Left</h2><canvas id="imageA" aria-label="Left result"></canvas></div>
<div class="card"><h2 id="captionB">Right</h2><canvas id="imageB" aria-label="Right result"></canvas></div>
</div>
<table aria-label="Errors against geometric reference"><thead><tr><th scope="col">Error against ray reference</th><th scope="col">Left</th><th scope="col">Right</th></tr></thead><tbody id="scores"></tbody></table>
<div class="legend" id="legend"><span><i class="dot"></i>False shadow</span><span><i class="dot miss"></i>Missed shadow</span><span>Contact ROI · first box hit within 2 m of its footprint</span></div>
</section>
</main>
<canvas id="engine" aria-hidden="true"></canvas>
<!-- PAYLOAD -->
</body>
</html>
